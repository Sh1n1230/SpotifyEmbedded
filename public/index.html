<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SpotifyEmbedded Demo</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    [hidden] { display: none !important; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #fff;
      color: #111;
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    h1 {
      font-size: 1rem;
      font-weight: 600;
      color: #888;
      letter-spacing: 0.05em;
      margin-bottom: 2rem;
    }

    /* ── Now Playing ─────────────────────────────── */
    #now-playing {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 0.75rem;
      max-width: 480px;
    }

    #album-art {
      width: 200px;
      height: 200px;
      object-fit: cover;
      border-radius: 4px;
      background: #eee;
    }

    #album-art-placeholder {
      width: 200px;
      height: 200px;
      background: #eee;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #aaa;
      font-size: 0.85rem;
    }

    #track-name {
      font-size: 1.25rem;
      font-weight: 700;
      line-height: 1.3;
    }

    #artist-name {
      font-size: 1rem;
      color: #555;
    }

    #mood-text {
      font-size: 1.5rem;
      font-weight: 600;
      margin-top: 0.5rem;
      color: #111;
    }

    #status-msg {
      font-size: 0.85rem;
      color: #aaa;
    }
  </style>
</head>
<body>

  <h1>SPOTIFYEMBEDDED DEMO</h1>

  <section id="now-playing">
    <img id="album-art" alt="" hidden>
    <div id="album-art-placeholder">読み込み中...</div>
    <p id="track-name"></p>
    <p id="artist-name"></p>
    <p id="mood-text"></p>
    <p id="status-msg"></p>
  </section>

  <script src="/demo.js" defer></script>
</body>
</html>
