name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'wrangler.jsonc'
      - 'package.json'
      - 'tsconfig*.json'
      - '.github/workflows/deploy-workers.yml'
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: cloudflare
      url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      # 静的モードだけを使うフォークには Cloudflare の Secrets が無い。そのまま進むと
      # wrangler deploy が毎回認証エラーで失敗し、失敗通知が届くので、ここで省く。
      # secrets はジョブの if: では参照できないため、ステップで判定して出力に書く。
      - name: Check Cloudflare secrets
        id: secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Cloudflare Workers へのデプロイを省略しました::CLOUDFLARE_API_TOKEN が未設定です。静的モードだけを使う場合は対応不要です。"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.secrets.outputs.configured == 'true'
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.secrets.outputs.configured == 'true'
        with:
          node-version: '24'
          cache: npm

      - if: steps.secrets.outputs.configured == 'true'
        run: npm ci --ignore-scripts
      - if: steps.secrets.outputs.configured == 'true'
        run: npm run build

      - name: Deploy to Cloudflare Workers
        id: deploy
        if: steps.secrets.outputs.configured == 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
