# サーバー不要モード。
#
# 30分おきに Spotify を取得し、SVG / JSON / HTML を spotify-data ブランチへ
# 公開する。GitHub Pages のソースにこのブランチを指定すると、README からも
# 自分のサイトからも参照できるようになる。
#
# 必要な Secrets（`npm run setup` で自動登録できる）:
#   SPOTIFY_CLIENT_ID / SPOTIFY_CLIENT_SECRET / SPOTIFY_REFRESH_TOKEN
#   LLM_API_KEY / LLM_BASE_URL / LLM_MODEL … 未設定ならムード文なしで生成する
#   （OpenAI互換なら提供元は問わない: OpenAI / OpenRouter / Gemini など）
name: Update Spotify snapshot

on:
  schedule:
    # 30分おきを「要求」するが、実際にこの通り走るとは限らない。
    # GitHub のスケジュール実行は混雑時に遅延・間引きされ、実測では
    # 2〜5時間あくこともある。秒単位の鮮度が要るならライブAPIモードを使う。
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      range:
        description: 'ランキングの集計期間'
        type: choice
        default: short_term
        options: [short_term, medium_term, long_term]
      count:
        description: 'ランキングの表示件数（1〜50）'
        type: string
        default: '5'
      refresh_ranking_mood:
        description: 'ランキングのムード文を、顔ぶれの変化に関係なく作り直す'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: spotify-snapshot
  # 実行中のものは止めない。公開ブランチへの push の途中で殺されると
  # 中途半端な状態が残りうる。20秒程度で終わるので待たせるだけで足りる。
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    # 通常は20秒程度。止まると同じ concurrency の後続を最大6時間（既定の上限）待たせるので短く切る
    timeout-minutes: 10
    permissions:
      contents: write # spotify-data ブランチへの push
    steps:
      # トークンを .git/config に残さない。push は最後のステップでだけ明示的に渡す。
      # 公開リポジトリなので、snapshot.json の fetch は認証なしで通る。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm

      - run: npm ci --ignore-scripts
      - run: npm run build

      # 停止中は「最後に聴いた曲」を前回の観測から引き継ぐ。
      # そのために公開ブランチの snapshot.json を復元しておく。
      - name: Restore previous snapshot
        env:
          REFRESH_RANKING_MOOD: ${{ inputs.refresh_ranking_mood }}
        run: |
          mkdir -p out
          if git fetch --depth=1 origin spotify-data 2>/dev/null; then
            git show FETCH_HEAD:snapshot.json > out/snapshot.json 2>/dev/null \
              && echo "前回のスナップショットを復元しました" \
              || echo "スナップショットがないので新規作成します"
          else
            echo "spotify-data ブランチがまだありません"
          fi
          if [ "$REFRESH_RANKING_MOOD" = "true" ] && [ -f out/snapshot.json ]; then
            node -e 'const f="out/snapshot.json",fs=require("fs"),s=JSON.parse(fs.readFileSync(f));s.ranking_mood=null;fs.writeFileSync(f,JSON.stringify(s))'
            echo "ランキングのムード文を作り直します"
          fi

      - name: Generate
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          # 手動実行時のみ指定できる。スケジュール実行では既定値を使う。
          RANGE: ${{ inputs.range || 'short_term' }}
          COUNT: ${{ inputs.count || '5' }}
        run: |
          if [ -n "$LLM_API_KEY" ]; then
            node dist/cli/index.js generate --out out --range "$RANGE" --count "$COUNT" --theme both
          else
            echo "LLM_API_KEY が未設定のため、ムード文なしで生成します"
            node dist/cli/index.js generate --out out --range "$RANGE" --count "$COUNT" --theme both --no-mood
          fi

      # 毎回1コミットに潰して force push する。
      # 30分おきの更新で履歴が肥大化するのを防ぐため。前のスナップショットへ戻す手段は持たない:
      # 中身は次の実行で作り直され、壊れた snapshot.json は generate が捨てて作り直すため。
      #
      # トークンは URL にも .git/config にも書かない。git が認証を求めたときだけ、
      # 環境変数から読むクレデンシャルヘルパーで渡す（ヘルパーの中の変数はヘルパーの
      # 実行時に展開されるので、git のコマンドラインにもトークンの値は載らない）。
      - name: Publish to spotify-data branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out
          touch .nojekyll
          git init -q
          git checkout -q -b spotify-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Update Spotify snapshot ($(date -u '+%Y-%m-%d %H:%M UTC'))"
          git -c credential.helper= \
            -c 'credential.helper=!f() { echo username=x-access-token; echo "password=$GITHUB_TOKEN"; }; f' \
            push -q --force "https://github.com/${GITHUB_REPOSITORY}.git" spotify-data
