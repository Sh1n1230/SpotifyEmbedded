name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # GitHub Release の作成
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm

      - run: npm ci --ignore-scripts

      - name: タグと package.json の版が一致しているか確かめる
        run: |
          package_version="v$(node -p "require('./package.json').version")"
          lock_version="v$(node -p "require('./package-lock.json').version")"
          if [ "$GITHUB_REF_NAME" != "$package_version" ] || [ "$GITHUB_REF_NAME" != "$lock_version" ]; then
            echo "::error::タグ $GITHUB_REF_NAME と package.json（$package_version）・package-lock.json（$lock_version）の版が一致しません"
            exit 1
          fi

      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

      - name: Pack npm artifact
        run: mkdir -p release && npm pack --pack-destination release

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; skipping creation"
          else
            gh release create "$GITHUB_REF_NAME" release/* --title "$GITHUB_REF_NAME" --generate-notes
          fi
