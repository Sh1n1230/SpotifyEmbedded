name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# PR に続けて push したら、古い実行を取り消す（main への push は、必須のチェックの結果を残すため取り消さない）
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    # 止まったまま後続を待たせない（通常は1分前後）
    timeout-minutes: 15
    strategy:
      # 片方の版の失敗で、もう片方の結果まで取り消さない（どの版で壊れたかが分かるように）
      fail-fast: false
      matrix:
        # package.json の engines（>=22）の範囲にある各メジャーで確かめる（26 は 2026-10-28 から Active LTS）
        node-version: ['22', '24', '26']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      # 依存の install スクリプトは走らせない（どれも無しで動く）
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run lint
      # カバレッジはレポートを残すだけで、ゲートにはしない（#119）
      - run: npm run test:coverage
      - run: npm run build

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.node-version == '24'
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  # Workers が実際に使う src/worker.ts からのバンドル。main に入ってからの
  # deploy-workers.yml で初めて壊れていると分かるのを防ぐ。--dry-run は認証なしで
  # バンドルと検査までを行い、アップロードはしない。
  workers-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm

      - run: npm ci --ignore-scripts
      - run: npx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/worker-bundle"

  # README で案内している Docker の配布形態。ビルドして起動し、/health を確かめる（push はしない）。
  # /health は Spotify を呼ばないのでダミーの値で足りる（必須の設定が無いと起動時に終了するため渡す）。
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - run: docker build -t spotify-embedded:ci .

      - name: 起動して /health を確かめる
        run: |
          docker run -d --name app -p 3000:3000 --health-interval=1s \
            -e SPOTIFY_CLIENT_ID=dummy -e SPOTIFY_CLIENT_SECRET=dummy -e SPOTIFY_REFRESH_TOKEN=dummy \
            spotify-embedded:ci
          for _ in $(seq 1 20); do
            if curl -fsS http://localhost:3000/health; then ready=1; break; fi
            sleep 1
          done
          if [ "${ready:-}" != 1 ]; then
            docker logs app
            exit 1
          fi

      # HEALTHCHECK のコマンドは壊れていてもビルドが通り、本番で unhealthy になって初めて分かる
      - name: HEALTHCHECK と実行ユーザーとラベルを確かめる
        run: |
          for _ in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' app)
            if [ "$status" = healthy ]; then break; fi
            sleep 1
          done
          test "$status" = healthy
          test "$(docker exec app id -u)" != 0
          docker inspect --format '{{index .Config.Labels "org.opencontainers.image.source"}}' app | grep -q 'github.com/Sh1n1230/SpotifyEmbedded'
          test "$(docker inspect --format '{{index .Config.Labels "org.opencontainers.image.licenses"}}' app)" = MIT

      # PID 1 の Node が SIGTERM を処理しないと、docker stop は猶予時間（10秒）いっぱい待たされる
      - name: docker stop がすぐ終わることを確かめる
        run: |
          start=$(date +%s)
          docker stop app
          elapsed=$(( $(date +%s) - start ))
          echo "docker stop: $elapsed 秒"
          test "$elapsed" -lt 8
          test "$(docker inspect --format '{{.State.ExitCode}}' app)" = 0

  # npm pack の成果物を、リポジトリの外の空のフォルダに入れて CLI が起動するかを確かめる。
  # package.json の files の漏れや、shebang・実行権限の問題は配布して初めて表に出るため。
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22', '24', '26']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: mkdir -p "$RUNNER_TEMP/pkg" && npm pack --pack-destination "$RUNNER_TEMP/pkg"

      - name: 空のフォルダに入れて spotify-embedded help を実行する
        working-directory: ${{ runner.temp }}
        run: |
          mkdir app && cd app
          npm init -y >/dev/null
          npm install --ignore-scripts "$RUNNER_TEMP"/pkg/*.tgz
          npx --no-install spotify-embedded help | tee help.txt
          grep -q 'npm run setup' help.txt

      # 静的ファイルの場所は作業ディレクトリではなく dist/index.js の位置から決まる（別の場所から起動しても 404 にならない）
      - name: 別の作業ディレクトリから起動しても /embed.js を返す
        working-directory: ${{ runner.temp }}
        env:
          SPOTIFY_CLIENT_ID: ci
          SPOTIFY_CLIENT_SECRET: ci
          SPOTIFY_REFRESH_TOKEN: ci
          PORT: '3123'
        run: |
          node app/node_modules/spotify-embedded/dist/index.js &
          server=$!
          for _ in $(seq 1 20); do
            curl -fsS -o /dev/null "http://127.0.0.1:$PORT/health" && break
            sleep 0.5
          done
          status=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:$PORT/embed.js")
          kill "$server"
          echo "GET /embed.js: $status"
          test "$status" = 200

  # ワークフローの定義の検査。shellcheck（ランナーに入っている）があれば run: の中も検査する。
  # actionlint はリリースのバイナリを版と sha256 で固定して取得する（Dependabot の対象外なので、更新するときは
  # 版と、リリースの actionlint_<版>_checksums.txt にある linux_amd64.tar.gz の sha256 を書き換える）
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: actionlint の導入
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl -fsSL --retry 5 --retry-all-errors -o "$archive" "https://github.com/rhysd/actionlint/releases/download/v$ACTIONLINT_VERSION/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "$ACTIONLINT_SHA256  $archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint

      - name: ワークフローの検査
        run: '"$RUNNER_TEMP/actionlint"'
