name: Deploy GitHub Pages

on:
  workflow_run:
    workflows: ["Update Spotify snapshot"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  # 進行中のデプロイは最後まで終わらせ、待っている実行だけを置き換える
  cancel-in-progress: false

jobs:
  deploy:
    # 既定のブランチで走った update の結果だけを公開する
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == github.event.repository.default_branch }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout published snapshot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: spotify-data
          persist-credentials: false

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      # snapshot.json は generate が次の実行へ持ち越すための内部の状態ファイルで、公開する出力ではない
      # （update-spotify.yml は spotify-data ブランチから復元するので、Pages に無くても困らない）
      - name: Collect public files
        run: |
          mkdir "$RUNNER_TEMP/site"
          cp -R . "$RUNNER_TEMP/site/"
          rm -rf "$RUNNER_TEMP/site/.git" "$RUNNER_TEMP/site/snapshot.json"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
