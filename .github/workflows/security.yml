# 秘密情報の混入・危険なコード・依存の既知の脆弱性・設定の不備を検査する。
# 検査の中身は security-checker (https://github.com/Sh1n1230/security-checker) にあり、ここでは呼ぶだけ。
name: Security Check

on:
  push:
    branches: [main]
  pull_request:
  # 変更の無い期間に公開された依存の脆弱性も見つけるため、週に1回も実行する（毎時0分は混むので避ける）
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    # 通常は1分かからない
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write # 結果を GitHub の Code Scanning に登録するため
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: Sh1n1230/security-checker@318c3995733ddb59dc065b497ac9ac07bbe49484 # v2.1.0
