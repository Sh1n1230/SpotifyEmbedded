version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # PR のタイトルを CONTRIBUTING の形（chore(deps): …）にそろえる
    commit-message:
      prefix: chore
      include: scope
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
      include: scope
    # アクションの更新は1つの PR にまとめる
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
    # Node のメジャーは CONTRIBUTING の「依存の更新」で、CI の matrix などと一緒に手で上げる（奇数版はサポートが短い）
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
