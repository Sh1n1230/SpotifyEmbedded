name: バグ報告
description: 動作がおかしいとき
labels: [bug]
body:
  - type: dropdown
    id: mode
    attributes:
      label: 利用モード
      options:
        - 静的モード（GitHub Actions）
        - ライブAPI（Cloudflare Workers）
        - ライブAPI（Node / Docker）
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: SpotifyEmbedded の版
      description: 'package.json の version、静的モードならフォークの最新のコミット（例 1.7.0、または abc1234）'
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js の版（Node・Docker・ローカルでの生成のとき）
      placeholder: '例: 24.11.0（node --version）'
  - type: input
    id: llm
    attributes:
      label: LLM のプロバイダ（任意）
      description: Gemini・OpenAI・Ollama など。API キーは貼らないでください。
  - type: textarea
    id: what
    attributes:
      label: 何が起きましたか
      description: 期待した動作と実際の動作。APIキーやトークンは絶対に貼らないでください。
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: ログ・再現手順
